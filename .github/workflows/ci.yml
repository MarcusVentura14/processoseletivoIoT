name: ESP32 Filesystem Build

on:
  push:
    branches:
      - main
      - feat/actions-build
  pull_request:
    branches:
      - main

jobs:
  build_filesystem:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true  # Garante o download do seu micropython.bin real e customizado

    - name: Build Docker image
      run: docker build -t esp32-builder -f Dockerfile .

    - name: Run container and generate fs.bin
      run: |
        docker run --name esp32-fs-builder esp32-builder /bin/bash
        docker cp esp32-fs-builder:/fs.bin .

    - name: Garante wokwi.toml limpo para liberar o console
      run: |
        # Sobrescreve o wokwi.toml dinamicamente para garantir que a porta serial
        # não seja redirecionada pelo rfc2217ServerPort na esteira.
        cat << 'EOF' > wokwi.toml
        [wokwi]
        version = 1
        firmware = "flasher_args.json"
        EOF

    - name: Test with Wokwi
      uses: wokwi/wokwi-ci-action@v1
      with:
        token: ${{ secrets.WOKWI_CLI_TOKEN }}
        path: .
        timeout: 60000
        expect_text: 'Teste'